
# Overlay de production, à utiliser avec :
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
# Différences avec le dev :
# - pas de bind-mount du code (l'image contient déjà le code buildé)
# - APP_ENV=prod
# - le port de la base de données n'est pas exposé à l'extérieur du réseau Docker
# - politique de redémarrage automatique
services:
  php:
    volumes: !override
      - uploads_data:/var/www/html/public/uploads
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8
      FFBAD_API_BASE_URL: ${FFBAD_API_BASE_URL:-https://api.ffbad.org}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM: ${MAILER_FROM}
    restart: unless-stopped

  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./public:/var/www/html/public
      - uploads_data:/var/www/html/public/uploads:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    restart: unless-stopped

  database:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    restart: unless-stopped

volumes:
  uploads_data:

# En prod, on ne veut pas exposer le port 5432 sur l'hôte (annule le compose.override.yaml de dev).
