# Instance de démonstration publique (demo.axiobad.click) — mêmes assets statiques que la prod
# (même checkout de code), mais les requêtes PHP sont envoyées au conteneur php-demo, qui pointe
# sur sa propre base de données (voir compose.demo.yaml).
server {
    listen 80;
    server_name demo.axiobad.click;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://demo.axiobad.click$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name demo.axiobad.click;
    root /var/www/html/public;

    ssl_certificate /etc/letsencrypt/live/demo.axiobad.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.axiobad.click/privkey.pem;

    client_max_body_size 14M;

    # Instance de démo : pas d'indexation par les moteurs de recherche.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php-demo:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
