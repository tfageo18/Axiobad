server {
    listen 80;
    server_name hac.axiobad.click axiobad.thomas-fageol.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://hac.axiobad.click$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hac.axiobad.click;
    root /var/www/html/public;

    ssl_certificate /etc/letsencrypt/live/hac.axiobad.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hac.axiobad.click/privkey.pem;

    client_max_body_size 14M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # Résolution dynamique du conteneur "php" via le DNS interne Docker plutôt qu'une
        # résolution figée au démarrage de nginx (fastcgi_pass avec un nom en dur ne se
        # re-résout jamais) : sinon, si "php" est recréé (nouveau déploiement) après que nginx a
        # déjà résolu et mis en cache son ancienne IP, nginx continue de parler à cette IP même si
        # elle a entre-temps été réattribuée à un autre conteneur.
        resolver 127.0.0.11 valid=10s;
        set $upstream_php php:9000;
        fastcgi_pass $upstream_php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}

# Ancien domaine : redirige vers le nouveau. Utilise encore son propre certificat existant (pour
# ne pas afficher d'erreur de certificat aux visiteurs qui y accèdent directement en HTTPS) tant
# qu'il reste valide ; peut être supprimé une fois qu'il n'est plus utile de rediriger.
server {
    listen 443 ssl;
    http2 on;
    server_name axiobad.thomas-fageol.fr;

    ssl_certificate /etc/letsencrypt/live/axiobad.thomas-fageol.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axiobad.thomas-fageol.fr/privkey.pem;

    location / {
        return 301 https://hac.axiobad.click$request_uri;
    }
}
