<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hors ligne — Axiobad</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background: #f4f6fb;
      color: #1c2333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1.5rem;
    }
    .carte {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(20, 30, 60, 0.08);
      padding: 2rem;
      max-width: 360px;
    }
    h1 { color: #12274a; font-size: 1.3rem; margin: 0 0 0.75rem; }
    button {
      background: #1b3a6b;
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="carte">
    <h1>Pas de connexion</h1>
    <p>Cette page nécessite une connexion internet. Réessayez une fois reconnecté.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
